services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '4000:4000' 
    env_file:
      - ./server/.env
  frontend:
    build:
      context: ./client/prayerapp
      dockerfile: Dockerfile
    ports:
      - '3000:3000' 
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    env_file:
      - ./.env
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data: